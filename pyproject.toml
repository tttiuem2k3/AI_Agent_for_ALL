[project]
name = "asoft-ai-services"
dynamic = ["version"]
description = "Python AI services platform for ASOFT ERPX."
readme = "README.md"
license = "Apache-2.0"
keywords = ["ASOFT", "ERPX", "AI services", "agent", "multi-agent", "LLM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "aioitertools",
    "anthropic",
    "dashscope",
    "docstring_parser",
    "filetype",
    "json5",
    "json_repair",
    "mcp",
    "httpx",
    "numpy",
    "openai",
    "python-datauri",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-exporter-otlp>=1.39.0",
    "opentelemetry-semantic-conventions>=0.60b0",
    "python-socketio",
    "shortuuid",
    "python-frontmatter",
    "jinja2",
    "aiofiles",
    "tree_sitter",
    "tree_sitter_bash",
    "jsonschema",
]

[project.optional-dependencies]
# ------------ Model APIs ------------
model-gemini = ["google-genai"]
model-ollama = ["ollama>=0.5.4"]
model-xai = ["xai-sdk"]
models = [
    "asoft-ai-services[model-ollama]",
    "asoft-ai-services[model-gemini]",
    "asoft-ai-services[model-xai]",
]
# ------------ Service ------------
service = [
    "fastapi",
    "uvicorn",
    "apscheduler",
    "ag-ui-protocol>=0.1.10",
    "pyodbc>=5.1",
]
# ------------ Storage backends ------------
storage-redis = ["redis"]
storage-sql = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
]
storage-s3 = ["aioboto3"]
# ------------ Channel ------------
channel = [
    "lark-oapi>=1.4.0",
    "discord.py>=2.3",
]
# ------------ Workspace -----------
workspace-docker = ["aiodocker"]
workspace-e2b = ["e2b"]
workspace-daytona = ["daytona"]
workspace-k8s = ["kubernetes-asyncio"]
workspace-opensandbox = ["opensandbox"]
workspace = [
    "asoft-ai-services[workspace-docker]",
    "asoft-ai-services[workspace-e2b]",
    "asoft-ai-services[workspace-daytona]",
    "asoft-ai-services[workspace-k8s]",
    "asoft-ai-services[workspace-opensandbox]",
]
# ------------ Tools ------------
tools = [
    "ripgrep",
]
# ------------ Vector stores ------------
vdb-qdrant = ["qdrant-client"]
vdb-milvus = [
    "pymilvus>=2.4.0",
    "milvus-lite>=3.1.0",
]
vdb-mongodb = ["pymongo>=4.7"]
vdb-elasticsearch = ["elasticsearch[async]>=8.12"]

# ------------ Document conversion ------------
document-conversion = [
    "asoft-document-conversion-native==0.1.9",
]

# ------------ RAG ------------
rag = [
    "pypdf",
    "python-pptx",
    "python-docx",
    "openpyxl>=3.1.5",
    "xlrd>=2.0",
    "pandas",
]

# ------------ Long-term middleware ------------
# Required by `Runtime.middleware._longterm_memory.Mem0Middleware`.
# Pinned to mem0 v2.x because the middleware targets that
# architecture: ADDITIVE_EXTRACTION_PROMPT + AGENT_CONTEXT_SUFFIX
# (replaced v1's USER/AGENT_MEMORY_EXTRACTION_PROMPT split) and the
# v3 phased pipeline in `_add_to_vector_store`. Running on mem0 1.x
# wouldn't crash but the 2-tier add fallback degenerates into a
# wasted LLM call.
memory-mem0 = ["mem0ai>=2.0.0"]
memory-reme = ["reme-ai>=0.4.0.6"]
memory = [
    "asoft-ai-services[memory-mem0]",
    "asoft-ai-services[memory-reme]",
]

# ------------ Deprecated aliases ------------
gemini = ["asoft-ai-services[model-gemini]"]
ollama = ["asoft-ai-services[model-ollama]"]
xai = ["asoft-ai-services[model-xai]"]
storage = ["asoft-ai-services[storage-redis]"]
sql = ["asoft-ai-services[storage-sql]"]
s3 = ["asoft-ai-services[storage-s3]"]
k8s = ["asoft-ai-services[workspace-k8s]"]
milvuslite = ["asoft-ai-services[vdb-milvus]"]
mongodb = ["asoft-ai-services[vdb-mongodb]"]
elasticsearch = ["asoft-ai-services[vdb-elasticsearch]"]
mem0 = ["asoft-ai-services[memory-mem0]"]
reme = ["asoft-ai-services[memory-reme]"]
# ------------ Full ------------
full = [
    "asoft-ai-services[models]",
    "asoft-ai-services[service]",
    "asoft-ai-services[storage-redis]",
    "asoft-ai-services[storage-sql]",
    "asoft-ai-services[storage-s3]",
    "asoft-ai-services[channel]",
    "asoft-ai-services[workspace]",
    "asoft-ai-services[tools]",
    "asoft-ai-services[document-conversion]",
    "asoft-ai-services[rag]",
    "asoft-ai-services[vdb-qdrant]",
    "asoft-ai-services[vdb-milvus]",
    "asoft-ai-services[vdb-mongodb]",
    "asoft-ai-services[vdb-elasticsearch]",
    "asoft-ai-services[memory]",
]

# ------------ Development ------------
dev = [
    # Include full dependencies from local package
    "asoft-ai-services[full]",
    # Development tools
    "pre-commit",
    "pytest",
    "pytest-forked",
    "maturin>=1.9,<2",
    "myst_parser",
    "matplotlib",
    "fakeredis",
]

[tool.uv]
required-version = ">=0.12.4,<0.13"

[tool.uv.sources]
asoft-document-conversion-native = { path = "src/Capabilities/document_conversion/_native/binding" }

[tool.setuptools]
packages = { find = { where = ["src"], exclude = ["Capabilities.document_conversion._native*", "Capabilities.document_conversion._vendor*"] } }
py-modules = ["_logging", "_version"]
include-package-data = true

[tool.setuptools.package-data]
# ``"*"`` applies to every discovered package. Patterns:
# - ``py.typed`` marks the typed package per PEP 561.
# - ``_models/*.yaml`` reaches into the data-only ``_models/``
#   subdirs that ship with each model provider (they have no
#   ``__init__.py`` and are not packages, but the files still
#   live alongside the parent package's source on disk).
"*" = ["py.typed", "_models/*.yaml", "_cosyvoice_models/*.yaml"]
"Capabilities.workspace._docker" = ["Dockerfile*.template"]

[tool.pytest.ini_options]
testpaths = ["development/tests"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}
